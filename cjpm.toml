[package]
  cjc-version = "1.0.0"
  name = "cangjie_community_knowledge_base"
  description = "Offline Cangjie community knowledge base baseline."
  version = "0.1.0"
  output-type = "executable"
  src-dir = ""
  target-dir = ""
  compile-option = "-Woff unused"
  link-option = ""
  package-configuration = {}

[profile.test]
  parallel = 1
  no-progress = true
  no-color = true

[profile.test.env]
  cjHeapSize = { value = "64MB", splice-type = "replace" }

[dependencies]
